name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 2
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Write-Host "✅ RDP configurado!"

      - name: Create RDP User
        shell: powershell
        run: |
          $Username = "Skyro"
          
          # Gera uma senha aleatória igual à imagem (15 caracteres)
          Add-Type -AssemblyName System.Web
          $Password = [System.Web.Security.Membership]::GeneratePassword(15, 4)
          
          # Salva a senha em um arquivo para usar no passo final
          $Password | Out-File -FilePath "password.txt"
          
          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force
          New-LocalUser -Name $Username -Password $SecurePassword -FullName $Username -Description "Usuario RDP"
          Add-LocalGroupMember -Group "Administrators" -Member $Username
          Write-Host "✅ Usuário $Username criado!"

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile "tailscale-setup.msi"
          Start-Process msiexec.exe -ArgumentList "/i tailscale-setup.msi /quiet /norestart" -Wait
          Write-Host "✅ Tailscale instalado!"

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          # ⚠️ COLE SUA CHAVE AQUI (A que começa com tskey-auth-)
          $AuthKey = "SUA_CHAVE_AQUI"
          
          if ($AuthKey -eq "SUA_CHAVE_AQUI") {
              Write-Error "❌ Você esqueceu de colocar a sua chave!"
              exit 1
          }
          
          # Conecta instantaneamente (sem esperar link)
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey $AuthKey --hostname "github-rdp-pc"
          
          Start-Sleep -Seconds 5
          Write-Host "Success."
          Write-Host "✅ Tailscale Conectado Rápido!"

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Test-NetConnection -ComputerName $ip -Port 3389
          Write-Host "✅ RDP Acessível!"

      - name: Maintain Connection
        shell: powershell
        run: |
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          $Password = Get-Content "password.txt"
          
          # Loop infinito para manter a máquina ligada e imprimir os dados
          while ($true) {
              Write-Host "================================="
              Write-Host "RDP ACCESS"
              Write-Host "================================="
              Write-Host "Address : $ip"
              Write-Host "Username: Skyro"
              Write-Host "Credential: User: Skyro | Password: $Password"
              Write-Host "================================="
              
              $Time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              Write-Host "[$Time] RDP Active"
              
              Start-Sleep -Seconds 3600 # Atualiza o log a cada 1 hora
          }
